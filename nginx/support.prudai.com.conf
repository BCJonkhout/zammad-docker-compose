server {
    listen 80;
    listen [::]:80;

    server_name support.prudai.com;

    # robots.txt (09-09-2026). Zammad levert er zelf geen; /opt/zammad/public
    # zit in het image, dus een bestand daar overleeft geen upgrade en kost een
    # container-recreate op een live supportstack. Een locatieblok hier is het
    # minst invasief en volgt het bestaande patroon van vault.prudai.com.
    # Standaard dicht, kennisbank expliciet vrijgegeven: nieuwe Zammad-paden
    # zijn dan vanzelf uitgesloten in plaats van vanzelf geindexeerd.
    # GEEN Sitemap-regel: support.prudai.com publiceert er (nog) geen.
    location = /robots.txt {
        default_type text/plain;
        return 200 "# support.prudai.com - Prudai klantenportaal (Zammad)\n# Standaard dicht; alleen de publieke kennisbank is vrijgegeven.\n\nUser-agent: *\n\n# Alles buiten /help/ is ticketverkeer, aanmelden of API: niet indexeren.\nDisallow: /\n\n# De kennisbank is bewust openbaar en mag vindbaar zijn. Crawlen moet ook\n# blijven kunnen om ingetrokken artikelen (404) uit de index te laten vallen.\n# Bewust zonder slotstreep: /help zelf (302 naar /help/nl-nl) is het canonieke\n# instappunt en zou met 'Allow: /help/' onder 'Disallow: /' blijven vallen.\nAllow: /help\n\n# Zonder CSS/JS kan een crawler een vrijgegeven kennisbankpagina niet renderen.\nAllow: /assets/\n";
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:18080/api/v1/getting_started;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://127.0.0.1:18080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
